# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory containing .bb and .bbappend files, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "raspberrypi-buildhat"
BBFILE_PATTERN_raspberrypi-buildhat = "^${LAYERDIR}/"
BBFILE_PRIORITY_raspberrypi-buildhat = "10"

LAYERVERSION_raspberrypi-buildhat = "1"
LAYERSERIES_COMPAT_raspberrypi-buildhat = "scarthgap"
LAYERDEPENDS_raspberrypi-buildhat = "core raspberrypi meta-python"
